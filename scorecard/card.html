<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Gino's Scorecard</title>
<style>
  :root {
    --bg: #f6f5f1; --ink: #1d2433; --muted: #5d6676; --line: #e6e4dd;
    --g: #1f8a4c; --g-bg: #e2f2e8;
    --r: #c2362f; --r-bg: #fbe1df;
    --b: #2f5fb3; --b-bg: #e6edf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: Inter, sans-serif; width: 640px; padding: 16px 18px 14px; font-size: 12.5px; line-height: 1.35; }

  .head { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-family: "Inter Display", Inter, sans-serif; font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
  h1 span { color: var(--muted); font-weight: 500; }
  .score { font-weight: 700; font-size: 13px; padding: 4px 11px; border-radius: 99px; color: #fff; }
  .score.g { background: var(--g); } .score.r { background: var(--r); }
  .sub { color: var(--muted); font-size: 11.5px; margin: 2px 0 10px; }
  .sub .sample { color: var(--r); font-weight: 700; letter-spacing: .06em; margin-left: 6px; }

  .lbl { font-size: 9.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--b); margin: 0 0 4px; display: flex; justify-content: space-between; }
  .lbl span { color: var(--muted); font-weight: 500; letter-spacing: .02em; text-transform: none; }
  .tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 10px; }
  .tile { border-radius: 7px; padding: 6px 7px 5px; }
  .tile.g { background: var(--g-bg); } .tile.r { background: var(--r-bg); }
  .tile .n { font-size: 10px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .tile .v { font-family: "Inter Display", Inter, sans-serif; font-size: 19px; font-weight: 700; line-height: 1.15; }
  .tile.g .v { color: var(--g); } .tile.r .v { color: var(--r); }
  .tile .t { font-size: 9.5px; color: var(--muted); }
  .tiles.soon .tile { border: 1.5px dashed #cbc8bf; background: transparent; }
  .tiles.soon .v { color: #c4c1b8; }

  .ask { background: #fff; border: 1.5px solid var(--r); border-radius: 8px; padding: 7px 10px 6px; margin-bottom: 10px; }
  .ask-h { font-size: 11.5px; margin-bottom: 4px; }
  .ask-h b { color: var(--r); }
  .it { display: grid; grid-template-columns: 18px 1fr; gap: 6px; padding: 3px 0; border-top: 1px solid var(--line); }
  .it .k { width: 17px; height: 17px; border-radius: 50%; background: var(--r); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .it b { font-weight: 600; }
  .it em { font-style: normal; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; margin: 0 4px; }

  .wk { background: var(--b-bg); border-radius: 7px; padding: 6px 10px; margin-bottom: 10px; font-size: 11.5px; }
  .wk b { color: var(--b); }
  .foot { font-size: 10px; color: var(--muted); display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* SAMPLE DATA ONLY. Green tile = target hit, red = missed. The "Reply with why" list is
   the day's items from the tracker's Reviews tab. */
const DAYS = {
  thu: {
    day: "Thu, Nov 12", sent: "Sent Fri, Nov 13",
    stats: "27 bookings · 61 dials · 9:02am–6:04pm MT",
    tiles: [
      ["Overnight", "4/4", "all dialed", "g"],
      ["Speed to lead", "92%", "target 85%", "g"],
      ["VM + text", "10/11", "every no-answer", "r"],
      ["Day-before", "5/5", "called", "g"],
      ["5:45 cancels", "1/2", "done", "r"],
      ["Logging", "1", "error", "r"]
    ],
    ask: [
      ["Lena Cho", "VM + text", "no voicemail after the 2:41pm no-answer"],
      ["Chris Morgan", "5:45 cancel", "not accepted, not cancelled (call Fri 10am)"],
      ["Ana Ruiz", "Logging", "logged accepted at 2:14pm, invite wasn't accepted"]
    ]
  },
  mon: {
    day: "Fri, Nov 13", sent: "Sent Mon, Nov 16",
    stats: "22 bookings · 54 dials · 9:00am–6:01pm MT · day-before and 5:45 = Saturday calls only",
    tiles: [
      ["Overnight", "5/5", "all dialed", "g"],
      ["Speed to lead", "100%", "target 85%", "g"],
      ["VM + text", "8/8", "every no-answer", "g"],
      ["Day-before", "3/3", "called", "g"],
      ["5:45 cancels", "1/1", "done", "g"],
      ["Logging", "0", "errors", "g"]
    ],
    ask: [],
    weekend: "<b>Weekend (not scored):</b> Sat 4 of 7 new bookings called, 3 accepted · Sun no calls"
  }
};

const d = window.CARD || DAYS[new URLSearchParams(location.search).get("v") || "thu"];
const hit = d.tiles.filter(t => t[3] === "g").length;
const tiles = ts => ts.map(([n, v, t, s]) => `<div class="tile ${s}"><div class="n">${n}</div><div class="v">${v}</div><div class="t">${t}</div></div>`).join("");

document.getElementById("app").innerHTML = `
  <div class="head"><h1>Gino's scorecard <span>· ${d.day}</span></h1>
    <span class="score ${hit === d.tiles.length ? "g" : "r"}">${hit} of ${d.tiles.length} hit</span></div>
  <div class="sub">${d.stats}${window.CARD ? "" : `<span class="sample">SAMPLE</span>`}</div>

  <div class="lbl">Call confirmation<span>green = hit · red = missed</span></div>
  <div class="tiles">${tiles(d.tiles)}</div>

  <div class="lbl">Call recovery<span>coming soon</span></div>
  <div class="tiles soon">${tiles([["No-shows", "–", ""], ["Cancels", "–", ""], ["Reschedules", "–", ""], ["Rebooked", "–", ""], ["Showed", "–", ""], ["Logging", "–", ""]].map(x => [...x, ""]))}</div>

  ${d.ask.length ? `<div class="ask"><div class="ask-h"><b>Reply with why (${d.ask.length}):</b> in this post's thread by noon MT, one line per number, e.g. "2: he asked me to wait"</div>
    ${d.ask.map(([who, sec, what], i) => `<div class="it"><span class="k">${i + 1}</span><span><b>${who}</b><em>${sec}</em>${what}</span></div>`).join("")}</div>` : ""}
  ${d.weekend ? `<div class="wk">${d.weekend}</div>` : ""}
  <div class="foot"><span>${d.sent}</span><span>${d.note || "Call times in ET"} · Questions? Sheila or Jay in #cc-gino</span></div>`;
</script>
</body>
</html>
